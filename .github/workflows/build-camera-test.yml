name: Build Camera Test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private Home Security signing key
        env:
          HOME_SECURITY_SIGNING: ${{ secrets.HOME_SECURITY_SIGNING }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path
          raw = os.environ.get('HOME_SECURITY_SIGNING', '')
          if not raw:
              raise SystemExit('Missing HOME_SECURITY_SIGNING repository secret. See camera-test/README.md.')
          bundle = json.loads(raw)
          password = bundle['password']
          print('::add-mask::' + password)
          path = Path(os.environ['RUNNER_TEMP']) / 'home-security.p12'
          path.write_bytes(base64.b64decode(bundle['keystore'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('HOME_SECURITY_KEYSTORE=' + str(path) + '\n')
              env.write('HOME_SECURITY_STORE_PASSWORD=' + password + '\n')
          PY
      - name: Build independent camera test
        run: |
          chmod +x launcher/gradlew
          launcher/gradlew -p camera-test --no-daemon testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Camera-Test-APK
          path: camera-test/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/home-security.p12"

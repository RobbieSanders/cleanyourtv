plugins { id 'com.android.application' }
android {
    namespace 'com.gathin.cameratest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gathin.cameratest'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.11'
    }
    signingConfigs {
        release {
            def filePath = System.getenv('HOME_SECURITY_KEYSTORE')
            def secret = System.getenv('HOME_SECURITY_STORE_PASSWORD')
            if (filePath && secret) {
                storeFile file(filePath)
                storePassword secret
                keyAlias 'home-security'
                keyPassword secret
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
